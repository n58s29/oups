<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16222E">
<title>Le Grand Départ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap');

:root{
  --velvet:#16222E; --velvet-2:#1D2C3C; --velvet-3:#26394D;
  --bone:#EDE6D6; --dim:#AFAC9E; --brass:#C2A15A; --brass-2:#8f7a48;
  --mum:#D96A45; --sage:#8FA895;
  --line:rgba(237,230,214,.13);
  --r:14px;
  --display:'Fraunces', Georgia, serif;
  --ui:system-ui,-apple-system,'Segoe UI',sans-serif;
  --top:56px; --bot:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{height:100%}
body{
  background:var(--velvet); color:var(--bone); font-family:var(--ui);
  font-size:16px; line-height:1.45; overscroll-behavior-y:none;
}
button,input{font:inherit;color:inherit}

/* ---------- shell ---------- */
#top{
  position:fixed;top:0;left:0;right:0;height:calc(var(--top) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 14px 0;
  display:flex;align-items:center;gap:10px;
  background:rgba(22,34,46,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);z-index:40;
}
#top .mark{font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:-.02em;white-space:nowrap}
#top .mark i{color:var(--brass);font-style:normal}
#top .meta{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.pill{border:1px solid var(--brass-2);color:var(--brass);border-radius:999px;padding:3px 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;background:none;cursor:default}
.pill.mumP{border-color:var(--mum);color:var(--mum)}
button.pill{cursor:pointer}

main{
  padding:calc(var(--top) + env(safe-area-inset-top) + 14px) 14px calc(var(--bot) + env(safe-area-inset-bottom) + 24px);
  max-width:620px;margin:0 auto;
}
#nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:rgba(22,34,46,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
}
#nav button{
  flex:1;background:none;border:none;padding:11px 4px 12px;cursor:pointer;
  color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;
}
#nav button .ico{font-size:19px;line-height:1}
#nav button.on{color:var(--brass)}
#nav[hidden]{display:none}

/* ---------- blocs ---------- */
h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,10.5vw,54px);line-height:.96;letter-spacing:-.03em}
h1 i{color:var(--brass);font-style:normal}
h2{font-family:var(--display);font-weight:600;font-size:21px;margin-bottom:2px}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.card{background:var(--velvet-2);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.gold{background:var(--velvet-3);box-shadow:inset 0 0 0 1px var(--brass-2)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--dim);font-size:13px}
.big{font-family:var(--display);font-size:20px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.brass{color:var(--brass)}.mumc{color:var(--mum)}.sagec{color:var(--sage)}
.sep{height:1px;background:var(--line);margin:12px 0}
.spacer{height:8px}

/* ---------- boutons ---------- */
.b{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:12px 18px;border:none;border-radius:12px;
  background:var(--velvet-3);color:var(--bone);font-size:15px;font-weight:500;cursor:pointer;
}
.b:active{transform:scale(.985)}
.b.or{background:var(--brass);color:#141f19;font-weight:700}
.b.mort{background:rgba(217,106,69,.16);color:var(--mum)}
.b.ghost{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--dim)}
.b.full{display:flex;width:100%}
.b.sm{min-height:38px;padding:8px 14px;font-size:14px;border-radius:10px}
.b:disabled{opacity:.4;pointer-events:none}
input.f{
  width:100%;min-height:48px;padding:12px 14px;border:none;border-radius:12px;
  background:var(--velvet-3);box-shadow:inset 0 0 0 1px var(--line);
}
input.f:focus{outline:none;box-shadow:inset 0 0 0 1px var(--brass)}
input.f::placeholder{color:rgba(175,172,158,.45)}
input.code{text-align:center;font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.35em;text-transform:uppercase}

/* ---------- avatars & fiches ---------- */
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--velvet-3);filter:grayscale(.35) sepia(.12)}
.av.ph{display:flex;align-items:center;justify-content:center;color:var(--brass);font-family:var(--display);font-size:18px;filter:none}
.av.lg{width:62px;height:62px;font-size:26px}
.av.dead{filter:grayscale(1) contrast(.9)}
.nm{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.15}
.ds{font-size:11.5px;color:var(--dim);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tile{background:var(--velvet-2);border-radius:12px;padding:12px;margin-bottom:8px;position:relative;overflow:hidden}
.tile.dead{background:rgba(217,106,69,.08);box-shadow:inset 0 0 0 1px rgba(217,106,69,.35)}
.tile .stamp{
  position:absolute;top:8px;right:-6px;transform:rotate(8deg);
  font-family:var(--display);font-weight:900;font-style:italic;font-size:13px;color:var(--mum);
  border:2px solid var(--mum);border-radius:6px;padding:1px 8px;opacity:.9;
}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--velvet-3);color:var(--dim);white-space:nowrap}
.tag.b{background:rgba(194,161,90,.16);color:var(--brass)}
.tag.m{background:rgba(217,106,69,.16);color:var(--mum)}
.tag.s{background:rgba(143,168,149,.16);color:var(--sage)}
.x{background:none;border:none;color:var(--dim);font-size:20px;padding:8px;cursor:pointer;flex-shrink:0}
.x:active{color:var(--mum)}

/* ---------- progression ---------- */
.bar{height:6px;border-radius:999px;background:var(--velvet-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .3s}

/* ---------- compte à rebours ---------- */
.cdBig{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.02em;line-height:1.05;color:var(--brass)}
.cdBig.late{color:var(--mum)}

/* ---------- sticky action ---------- */
.sticky{
  position:fixed;left:0;right:0;bottom:calc(var(--bot) + env(safe-area-inset-bottom));
  padding:10px 14px 12px;z-index:35;
  background:linear-gradient(to top,rgba(22,34,46,.98) 55%,rgba(22,34,46,0));
}
.sticky .in{max-width:620px;margin:0 auto;display:flex;gap:8px}

/* ---------- sheet ---------- */
#veil{position:fixed;inset:0;background:rgba(6,10,14,.7);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#veil.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:var(--velvet-2);border-radius:20px 20px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
}
#sheet.on{transform:none}
.handle{width:40px;height:4px;border-radius:999px;background:var(--line);margin:6px auto 14px}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;padding:11px 4px;cursor:pointer;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:none}
.res:disabled{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--velvet-3);border:none;border-radius:999px;padding:10px 14px;font-size:14px;cursor:pointer;min-height:42px}
.chip.on{background:var(--brass);color:#141f19;font-weight:700}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(var(--bot) + env(safe-area-inset-bottom) + 74px);
  transform:translate(-50%,20px);z-index:80;max-width:92vw;
  background:var(--brass);color:#141f19;font-weight:600;font-size:14px;
  padding:11px 18px;border-radius:999px;text-align:center;
  opacity:0;pointer-events:none;transition:all .25s;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--mum);color:var(--bone)}

.empty{text-align:center;color:var(--dim);font-size:14px;padding:30px 12px}
.empty .g{font-family:var(--display);font-size:19px;color:var(--bone);margin-bottom:5px}
ol.rules{padding-left:20px;display:flex;flex-direction:column;gap:11px;font-size:14.5px}
ol.rules li::marker{color:var(--brass);font-family:var(--display);font-weight:700}
ol.rules b{color:var(--brass);font-weight:600}
footer{text-align:center;color:var(--dim);font-size:11.5px;padding:18px 0 4px}
footer button{background:none;border:none;color:var(--dim);text-decoration:underline;cursor:pointer;font-size:11.5px;padding:6px}
</style>
</head>
<body>

<header id="top">
  <div class="mark">Le Grand Départ<i>.</i></div>
  <div class="meta" id="topMeta"></div>
</header>

<main id="app"></main>

<nav id="nav" hidden>
  <button data-act="tab" data-tab="mine"><span class="ico">🎫</span>Sélection</button>
  <button data-act="tab" data-tab="quai"><span class="ico">🚉</span>Le quai</button>
  <button data-act="tab" data-tab="rank"><span class="ico">☰</span>Classement</button>
</nav>

<div id="veil" data-act="closesheet"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script type="module">
'use strict';

/* ══════════════════════════════════════════════════════════════
   1. CONFIG — mêmes clés que Oups v2 : les tables gd_* cohabitent
   avec l'ancienne table games dans le même projet Supabase.
   ══════════════════════════════════════════════════════════════ */
const CFG = {
  url : 'https://puynraoxlespwvophzko.supabase.co',
  key : 'sb_publishable_KlSdNqNkpdupsk527jlwaA_QGqYlzJa'
};
const TODAY  = new Date();
const SEASON = TODAY.getFullYear();
const CHECK_EVERY_H = 6;   // au plus un check Wikidata toutes les 6 h par partie

/* ══════════════════════════════════════════════════════════════
   2. UTILITAIRES
   ══════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

function fdate(d){
  if(!d) return '?';
  if(!d.m) return String(d.y);
  return (d.d ? d.d + ' ' : '') + MOIS[d.m - 1] + ' ' + d.y;
}
function parseWikiDate(t){
  const m = t && String(t).match(/^\+(\d{4})-(\d{2})-(\d{2})/);
  return m ? {y:+m[1], m:+m[2] || 0, d:+m[3] || 0} : null;
}
function ageAt(birth, ref){
  if(!birth) return null;
  const ry = ref instanceof Date ? ref.getFullYear() : ref.y;
  const rm = ref instanceof Date ? ref.getMonth() + 1 : (ref.m || 7);
  const rd = ref instanceof Date ? ref.getDate() : (ref.d || 1);
  const bm = birth.m || 7, bd = birth.d || 1;
  let a = ry - birth.y;
  if(rm < bm || (rm === bm && rd < bd)) a--;
  return a;
}
const ptsFor = a => a >= 90 ? 1 : Math.max(1, 90 - a);
function cdown(ms){
  if(ms <= 0) return '00:00';
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600),
        m = Math.floor(s % 3600 / 60), x = s % 60;
  const p = n => String(n).padStart(2, '0');
  if(d) return d + ' j ' + p(h) + ' h';
  if(h) return h + ':' + p(m) + ':' + p(x);
  return p(m) + ':' + p(x);
}

let toastT;
function toast(msg, bad){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('bad', !!bad);
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), bad ? 6000 : 3200);
}
function errText(e){
  if(!e) return 'erreur inconnue';
  if(typeof e === 'string') return e;
  return [e.message, e.details, e.hint, e.code ? '(' + e.code + ')' : '']
    .filter(Boolean).join(' · ') || JSON.stringify(e).slice(0, 200);
}
function fail(where, e){
  console.error('[GD]', where, e);
  toast(where + ' : ' + errText(e), true);
}
window.addEventListener('unhandledrejection', e => fail('Erreur', e.reason));
window.addEventListener('error', e => fail('Erreur', e.error || e.message));

function busy(el, txt){
  if(!el) return () => {};
  const old = el.innerHTML;
  el.disabled = true;
  el.innerHTML = txt || 'Un instant…';
  return () => { el.disabled = false; el.innerHTML = old; };
}
const LS = { get:k => { try{ return localStorage.getItem(k); }catch(e){ return null; } },
             set:(k,v) => { try{ localStorage.setItem(k,v); }catch(e){} },
             del:k => { try{ localStorage.removeItem(k); }catch(e){} } };

/* ══════════════════════════════════════════════════════════════
   3. WIKIPÉDIA / WIKIDATA
   ══════════════════════════════════════════════════════════════ */
async function wikiSearch(q){
  const url = 'https://fr.wikipedia.org/w/api.php?action=query&generator=prefixsearch'
    + '&gpssearch=' + encodeURIComponent(q) + '&gpslimit=7'
    + '&prop=pageprops%7Cdescription%7Cpageimages&ppprop=wikibase_item'
    + '&piprop=thumbnail&pithumbsize=90&format=json&origin=*';
  const d = await (await fetch(url)).json();
  return Object.values((d.query || {}).pages || {})
    .sort((a, b) => a.index - b.index)
    .filter(p => p.pageprops && p.pageprops.wikibase_item)
    .map(p => ({ name: p.title, desc: p.description || '', qid: p.pageprops.wikibase_item,
                 thumb: p.thumbnail ? p.thumbnail.source : null }));
}
/** Dates pour 1..n QIDs, par lots de 40. → {qid:{birth,death}} */
async function wikiDates(qids){
  if(!qids.length) return {};
  const out = {};
  for(let i = 0; i < qids.length; i += 40){
    const part = qids.slice(i, i + 40);
    const url = 'https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' + part.join('|')
      + '&props=claims&format=json&origin=*';
    const d = await (await fetch(url)).json();
    Object.keys(d.entities || {}).forEach(q => {
      const cl = (d.entities[q] || {}).claims || {};
      const get = p => {
        const c = (cl[p] || [])[0];
        return c && c.mainsnak && c.mainsnak.datavalue ? c.mainsnak.datavalue.value.time : null;
      };
      out[q] = { birth: parseWikiDate(get('P569')), death: parseWikiDate(get('P570')) };
    });
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════
   4. SUPABASE
   ══════════════════════════════════════════════════════════════ */
const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
const sb = createClient(CFG.url.trim().replace(/\/+$/, ''), CFG.key.trim(),
                        { realtime: { params: { eventsPerSecond: 5 } } });

/* ══════════════════════════════════════════════════════════════
   5. ÉTAT CLIENT
   ══════════════════════════════════════════════════════════════ */
let ME = null;         // user id (auth.uid)
let PROFILE = null;    // {id, pseudo}
let MYGAMES = [];      // pour l'accueil
let G = null;          // partie ouverte (ligne gd_games)
let PARTS = [];        // participants (+ pseudo via embed)
let PICKS = [];        // tous les picks de la partie
let tab = 'mine';
let RES = [];          // résultats de recherche
let DRAFT = null;      // fiche en cours de réservation
let LMIN = 60;         // durée de phase sélectionnée par l'admin (lobby)
let ch = null, poll = null, cdT = null;

const nameOf = uid => {
  const p = PARTS.find(x => x.user_id === uid);
  return p && p.gd_profiles ? p.gd_profiles.pseudo : '?';
};
const picksOf = uid => PICKS.filter(p => p.user_id === uid);
const myPicks = () => picksOf(ME);
const ptsOf   = uid => picksOf(uid).reduce((s, p) => s + (p.points || 0), 0);
const endsMs  = () => G && G.choice_ends_at ? new Date(G.choice_ends_at).getTime() : null;

/** lobby | choice | live — dérivé de l'horloge, aucune transition serveur. */
function phase(){
  if(!G) return null;
  const e = endsMs();
  if(e === null) return 'lobby';
  return Date.now() < e ? 'choice' : 'live';
}
const isAdmin = () => G && G.admin_id === ME;

/* ══════════════════════════════════════════════════════════════
   6. DONNÉES
   ══════════════════════════════════════════════════════════════ */
async function loadMyGames(){
  const { data, error } = await sb.from('gd_participants')
    .select('game_id, gd_games(id, code, name, season, choice_ends_at, admin_id, created_at)')
    .eq('user_id', ME);
  if(error) throw error;
  MYGAMES = (data || []).map(r => r.gd_games).filter(Boolean)
    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
}

async function fetchBundle(gid){
  const [g, pa, pk] = await Promise.all([
    sb.from('gd_games').select('*').eq('id', gid).maybeSingle(),
    sb.from('gd_participants').select('*, gd_profiles(pseudo)').eq('game_id', gid),
    sb.from('gd_picks').select('*').eq('game_id', gid)
  ]);
  if(g.error) throw g.error;
  if(pa.error) throw pa.error;
  if(pk.error) throw pk.error;
  return { game: g.data, parts: pa.data || [], picks: pk.data || [] };
}

async function openGame(gid){
  const b = await fetchBundle(gid);
  if(!b.game){ toast('Cette partie n’existe plus.', true); return goHome(); }
  G = b.game; PARTS = b.parts; PICKS = b.picks;
  tab = 'mine';
  LS.set('gd:last', G.id);
  subscribe();
  render();
  if(phase() === 'live'){
    showDigest();
    checkDeaths(false);
  }
  touchSeen();
}

async function refreshGame(){
  if(!G) return;
  try{
    const b = await fetchBundle(G.id);
    if(!b.game){ toast('La partie a été supprimée par son organisateur.', true); return goHome(); }
    const newDeaths = b.picks.filter(p => p.dead && !PICKS.some(x => x.id === p.id && x.dead));
    G = b.game; PARTS = b.parts; PICKS = b.picks;
    newDeaths.forEach(announceDeath);
    render();
  }catch(e){ /* réseau capricieux : le poll réessaiera */ }
}

function announceDeath(p){
  toast('🚂 Grand départ : ' + p.name + ' — ' + (p.points ? '+' + p.points + ' pts pour ' + nameOf(p.user_id) : 'hors délai pour ' + nameOf(p.user_id)) + '.', true);
}

function subscribe(){
  unsubscribe();
  ch = sb.channel('gd:' + G.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gd_picks', filter: 'game_id=eq.' + G.id }, p => {
      if(p.eventType === 'INSERT' && p.new){
        if(!PICKS.some(x => x.id === p.new.id)) PICKS.push(p.new);
      } else if(p.eventType === 'DELETE' && p.old){
        PICKS = PICKS.filter(x => x.id !== p.old.id);
      } else if(p.eventType === 'UPDATE' && p.new){
        const before = PICKS.find(x => x.id === p.new.id);
        PICKS = PICKS.map(x => x.id === p.new.id ? p.new : x);
        if(p.new.dead && (!before || !before.dead)) announceDeath(p.new);
      }
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gd_participants', filter: 'game_id=eq.' + G.id }, () => {
      // il faut le pseudo → on refetch la liste (léger)
      sb.from('gd_participants').select('*, gd_profiles(pseudo)').eq('game_id', G.id)
        .then(r => { if(!r.error){ PARTS = r.data || []; render(); } });
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'gd_games', filter: 'id=eq.' + G.id }, p => {
      if(p.new){ G = p.new; render(); }
    })
    .subscribe();
  // filet : realtime coupé → on resynchronise quand l'onglet est visible
  poll = setInterval(() => { if(document.visibilityState === 'visible') refreshGame(); }, 30000);
  // horloge de la phase de choix
  cdT = setInterval(() => {
    if(!G || phase() !== 'choice'){
      if($('#cd') || $('#cdp')) render();   // l'horloge vient de basculer → plein rendu
      return;
    }
    const left = endsMs() - Date.now();
    const el = $('#cd'); if(el){ el.textContent = cdown(left); el.classList.toggle('late', left < 60000); }

}
function unsubscribe(){

async function createGame(name){

    const code = randCode();
    const { data, error } = await sb.from('gd_games')
      .insert({ code, name: name || 'Le Grand Départ', admin_id: ME }).select().maybeSingle();

      await sb.from('gd_participants').insert({ game_id: data.id, user_id: ME });

    }
    if(error && error.code !== '23505') throw error;
  }
  toast('Impossible de tirer un code libre, réessaie.', true);
}

async function joinByCode(code){
  code = code.toUpperCase().trim();
  const { data: g, error } = await sb.from('gd_games').select('id').eq('code', code).maybeSingle();
  if(error) return fail('Recherche de la partie', error);

/* --- décès --- */
async function checkDeaths(force){
  if(!G || phase() === 'lobby') return;
  if(!force && G.last_death_check
     && Date.now() - new Date(G.last_death_check).getTime() < CHECK_EVERY_H * 3600e3) return;
  const alive = PICKS.filter(p => !p.dead);
  if(!alive.length){ if(force) toast('Aucune réservation à vérifier.'); return; }
  let data;
  try{ data = await wikiDates([...new Set(alive.map(p => p.qid))]); }
  catch(e){ if(force) toast('Wikidata injoignable.', true); return; }
  const deaths = [];
  alive.forEach(p => {
    const d = data[p.qid];
    if(d && d.death) deaths.push({ qid: p.qid, death: d.death, age: ageAt(p.birth || d.birth, d.death) });
  });
  const { data: n, error } = await sb.rpc('gd_record_deaths',
    { p_game: G.id, p_deaths: deaths, p_force: !!force });
  if(error) return fail('Enregistrement des décès', error);
  if(n > 0) await refreshGame();
  else if(force && n === 0) toast('Tout le monde est à bord. Dommage.');
  else if(force && n === -1) toast('Déjà vérifié il y a moins de ' + CHECK_EVERY_H + ' h.');
}

function showDigest(){
  const mine = PARTS.find(p => p.user_id === ME);
  if(!mine) return;
  const since = new Date(mine.last_seen_at).getTime();
  const news = PICKS.filter(p => p.dead && p.death_seen_at && new Date(p.death_seen_at).getTime() > since);
  if(!news.length) return;
  openSheet('<h2>Pendant ton absence</h2>'
    + '<p class="sub">' + news.length + ' grand' + (news.length > 1 ? 's' : '') + ' départ' + (news.length > 1 ? 's' : '') + ' annoncé' + (news.length > 1 ? 's' : '') + '.</p>'
    + news.map(p => '<div class="tile dead"><div class="stamp">Parti·e</div><div class="row">'
        + avatar(p)
        + '<div class="grow"><div class="nm">' + esc(p.name) + '</div>'
        + '<div class="ds">✝ ' + fdate(p.death_date) + ' · ' + p.age_death + ' ans</div></div>'
        + '<div style="text-align:right"><span class="tag m">' + (p.points ? '+' + p.points + ' pts' : 'hors délai') + '</span>'

      + (ph === 'choice' ? '<span class="pill mumP num" id="cdp">' + cdown(endsMs() - Date.now()) + '</span>' : '')

  if(!PROFILE){ nav.hidden = true; app.innerHTML = viewPseudo(); return; }

  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));

        <span class="big" style="width:26px;color:${i === 0 && r.pts ? 'var(--brass)' : 'var(--dim)'}">${i + 1}</span>
        <div class="grow">
          <div class="nm">${esc(nameOf(r.uid))}${r.uid === ME ? ' <span class="tag s">toi</span>' : ''}</div>
          <div class="mut" style="font-size:12px">${r.dead} ✝ · ${r.size}/${G.max_picks}</div>
        </div>
        <span class="big num" style="font-size:26px;color:${r.pts ? 'var(--brass)' : 'var(--dim)'}">${r.pts}</span>
      </div>
      <div class="bar" style="margin-top:9px"><i style="width:${Math.round(r.pts / top * 100)}%"></i></div>
    </div>`).join('')}
  <div class="spacer"></div>
  <button class="b ghost full sm" data-act="rules">Règles</button>
  <div class="spacer"></div>
  <button class="b ghost full sm" data-act="home">← Mes parties</button>`;
}

function openSheet(html){
  $('#sheet').innerHTML = '<div class="handle"></div>' + html;
  $('#sheet').classList.add('on');
  $('#veil').classList.add('on');
}
function closeSheet(){
  $('#sheet').classList.remove('on');
  $('#veil').classList.remove('on');
  DRAFT = null;
}

function sheetSearch(){
  openSheet(`
    <h2>Qui va nous quitter ?</h2>
    <p class="sub">Recherche sur Wikipédia. Pas de page, pas de billet.</p>
    <input class="f" id="q" placeholder="Nom de la célébrité…" autocomplete="off" autocorrect="off">
    <div id="res" style="margin-top:12px"></div>`);
  const q = $('#q');
  setTimeout(() => q.focus(), 220);
  let deb, seq = 0;
  q.addEventListener('input', () => {
    const term = q.value.trim();
    clearTimeout(deb);
    if(term.length < 2){ $('#res').innerHTML = ''; return; }
    $('#res').innerHTML = '<div class="mut" style="padding:10px 4px">Consultation du registre…</div>';
    deb = setTimeout(async () => {
      const mark = ++seq;
      try {
        const r = await wikiSearch(term);
        if(mark !== seq) return;
        RES = r;
        $('#res').innerHTML = r.length
          ? r.map((s, i) => {
              const t = PICKS.find(p => p.qid === s.qid);
              const taken = t ? (t.user_id === ME ? 'à toi' : 'pris·e — ' + nameOf(t.user_id)) : null;
              return `<button class="res" data-act="pick" data-i="${i}" ${taken ? 'disabled' : ''}>
                ${s.thumb ? '<img class="av" src="' + esc(s.thumb) + '" alt="">' : '<span class="av ph">🚂</span>'}
                <span class="grow"><span class="nm" style="display:block">${esc(s.name)}</span>
                <span class="ds">${esc(s.desc)}</span></span>
                ${taken ? '<span class="tag m">' + esc(taken) + '</span>' : ''}</button>`;
            }).join('')
          : '<div class="empty">Aucune page Wikipédia. Tonton Gérard, on a dit non.</div>';
      } catch(e){
        if(mark !== seq) return;
        $('#res').innerHTML = '<div class="empty"><div class="g">Wikipédia injoignable.</div>Vérifie ta connexion.</div>';
      }
    }, 300);
  });
}

async function pickResult(i){
  const s = RES[i];
  if(!s) return;
  openSheet('<div class="empty"><div class="g">' + esc(s.name) + '</div>Consultation du registre…</div>');
  let d = {};
  try { d = (await wikiDates([s.qid]))[s.qid] || {}; }
  catch(e){ openSheet('<div class="empty"><div class="g">Wikidata injoignable.</div>Réessaie.</div>'); return; }

  if(d.death){
    const a = ageAt(d.birth, d.death);
    return openSheet(`<div class="empty"><div class="g">Le train est déjà passé.</div>
      ${esc(s.name)} est décédé·e le ${fdate(d.death)}${a ? ' à ' + a + ' ans' : ''}.</div>
      <button class="b full ghost" data-act="search">Chercher quelqu’un d’autre</button>`);
  }
  if(!d.birth){
    return openSheet(`<div class="empty"><div class="g">Date de naissance introuvable.</div>
      Wikidata ne documente pas ${esc(s.name)}. Choisis quelqu’un de mieux fiché.</div>
      <button class="b full ghost" data-act="search">Chercher quelqu’un d’autre</button>`);
  }
  const taken = PICKS.find(p => p.qid === s.qid);
  if(taken){
    return openSheet(`<div class="empty"><div class="g">Déjà réservé·e.</div>
      ${esc(s.name)} voyage avec ${esc(nameOf(taken.user_id))}. Exclusivité, règle n°3.</div>
      <button class="b full ghost" data-act="search">Chercher quelqu’un d’autre</button>`);
  }

  const age = ageAt(d.birth, TODAY);
  const value = ptsFor(age);
  DRAFT = { qid: s.qid, name: s.name, desc: s.desc, thumb: s.thumb, birth: d.birth, age, value };
  openSheet(`
    <div class="row" style="gap:14px;margin-bottom:14px">
      ${avatar(DRAFT, 'lg')}
      <div class="grow">
        <div class="nm" style="font-size:20px">${esc(DRAFT.name)}</div>
        <div class="ds">${esc(DRAFT.desc)}</div>
      </div>
    </div>
    <div class="card gold" style="margin-bottom:14px">
      <div class="row">
        <div class="grow"><div class="mut">Âge</div><div class="big">${DRAFT.age} ans</div></div>
        <div style="text-align:right"><div class="mut">Vaut</div>
        <div class="big brass">${DRAFT.value} pts</div></div>
      </div>
      <p class="mut" style="margin-top:8px;font-size:12px">
        Si le grand départ a lieu après ta réservation, tu encaisses ${DRAFT.value} points.
        Premier arrivé, premier servi : quelqu’un peut te griller pendant que tu hésites.</p>
    </div>
    <button class="b or full" data-act="reserve">🎫 Réserver — c’est exclusif</button>
    <div class="spacer"></div>
    <button class="b ghost full sm" data-act="search">Annuler</button>`);
}

    <ol class="rules">

      <li>Départ à <b>90 ans ou plus : 1 point</b>. Sinon, <b>90 − l’âge</b> (47 ans = 43 points). Un décès <b>antérieur à ta réservation</b> ne rapporte rien — on peut monter dans le train en marche, mais on ne rattrape pas les wagons partis.</li>

}

    const ps = ($('#iPseudo2').value || '').trim();
